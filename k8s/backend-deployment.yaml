# Trading Wizard Web - Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trading-wizard
  labels:
    app: trading-wizard
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-wizard
      component: backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: trading-wizard
        component: backend
    spec:
      containers:
        - name: backend
          image: splkm97/trading-wizard-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: "HS256"
            - name: JWT_EXPIRE_MINUTES
              value: "1440"  # 24 hours
            - name: CORS_ORIGINS
              value: "http://localhost:5173,http://localhost:8080,http://frontend,http://frontend.trading-wizard.svc.cluster.local,http://trading-wizard.local"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5

---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: trading-wizard
  labels:
    app: trading-wizard
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: trading-wizard
    component: backend
