openapi: 3.0.3
info:
  title: Trading Simulation Game API
  description: 턴제 기반 트레이딩 시뮬레이션 게임 API
  version: 1.0.0

servers:
  - url: /api/simulation
    description: Simulation API base path

security:
  - bearerAuth: []

paths:
  /sessions:
    post:
      summary: 새 게임 세션 생성
      operationId: createGameSession
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 게임 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionResponse'
        '400':
          description: 잘못된 요청 (날짜 범위 오류 등)
        '401':
          description: 인증 실패

    get:
      summary: 사용자의 게임 세션 목록 조회
      operationId: listGameSessions
      tags: [Sessions]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/GameStatus'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 게임 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionListResponse'

  /sessions/{sessionId}:
    get:
      summary: 게임 세션 상세 조회
      operationId: getGameSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 게임 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
        '404':
          description: 게임을 찾을 수 없음

    delete:
      summary: 게임 세션 삭제
      operationId: deleteGameSession
      tags: [Sessions]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: 삭제 성공
        '404':
          description: 게임을 찾을 수 없음

  /sessions/{sessionId}/recommendations:
    get:
      summary: 현재 턴의 추천 종목 조회
      operationId: getRecommendations
      tags: [Gameplay]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 추천 종목 리스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'

  /sessions/{sessionId}/stocks/{stockCode}:
    get:
      summary: 종목 상세 정보 (차트 데이터 + 지표)
      operationId: getStockDetail
      tags: [Gameplay]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: stockCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 종목 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockDetailResponse'

  /sessions/{sessionId}/trade:
    post:
      summary: 거래 실행 (매수/매도)
      operationId: executeTrade
      tags: [Gameplay]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeRequest'
      responses:
        '200':
          description: 거래 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
        '400':
          description: 거래 실패 (현금 부족 등)

  /sessions/{sessionId}/turn:
    post:
      summary: 다음 턴으로 진행 (Next Day)
      operationId: advanceTurn
      tags: [Gameplay]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 턴 진행 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnResultResponse'
        '400':
          description: 턴 진행 불가 (이미 종료 등)

  /sessions/{sessionId}/report:
    get:
      summary: 현재까지의 백테스트 리포트 조회
      operationId: getReport
      tags: [Report]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 백테스트 리포트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestReportResponse'

  /sessions/{sessionId}/export:
    get:
      summary: 거래 이력 JSON 내보내기
      operationId: exportTrades
      tags: [Report]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: JSON 파일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    GameStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]

    TradeAction:
      type: string
      enum: [BUY, SELL]

    CreateSessionRequest:
      type: object
      required: [start_date, end_date]
      properties:
        name:
          type: string
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        initial_capital:
          type: number
          default: 100000000
          minimum: 1000000

    GameSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        current_date:
          type: string
          format: date
        initial_capital:
          type: number
        cash_balance:
          type: number
        status:
          $ref: '#/components/schemas/GameStatus'
        created_at:
          type: string
          format: date-time

    GameSessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/GameSessionResponse'
        total:
          type: integer

    PositionResponse:
      type: object
      properties:
        stock_code:
          type: string
        stock_name:
          type: string
        quantity:
          type: integer
        avg_entry_price:
          type: number
        entry_date:
          type: string
          format: date
        current_price:
          type: number
        current_value:
          type: number
        unrealized_pnl:
          type: number
        unrealized_pnl_pct:
          type: number

    PortfolioSummary:
      type: object
      properties:
        cash_balance:
          type: number
        positions_value:
          type: number
        total_value:
          type: number
        total_return:
          type: number
        total_return_pct:
          type: number
        positions_count:
          type: integer

    GameStateResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/GameSessionResponse'
        portfolio:
          $ref: '#/components/schemas/PortfolioSummary'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionResponse'
        turn_number:
          type: integer
        total_turns:
          type: integer
        is_last_turn:
          type: boolean

    RecommendationItem:
      type: object
      properties:
        stock_code:
          type: string
        stock_name:
          type: string
        confidence_score:
          type: number
        current_price:
          type: number
        is_owned:
          type: boolean
        position_quantity:
          type: integer
          nullable: true

    RecommendationsResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
        message:
          type: string
          nullable: true

    IndicatorData:
      type: object
      properties:
        bollinger_upper:
          type: number
        bollinger_middle:
          type: number
        bollinger_lower:
          type: number
        rsi:
          type: number
        macd:
          type: number
        macd_signal:
          type: number
        macd_histogram:
          type: number
        volume_ratio:
          type: number

    PricePoint:
      type: object
      properties:
        date:
          type: string
          format: date
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer

    StockDetailResponse:
      type: object
      properties:
        stock_code:
          type: string
        stock_name:
          type: string
        current_price:
          type: number
        confidence_score:
          type: number
        indicators:
          $ref: '#/components/schemas/IndicatorData'
        price_history:
          type: array
          items:
            $ref: '#/components/schemas/PricePoint'
        is_owned:
          type: boolean
        position:
          $ref: '#/components/schemas/PositionResponse'
          nullable: true

    TradeRequest:
      type: object
      required: [stock_code, action]
      properties:
        stock_code:
          type: string
        action:
          $ref: '#/components/schemas/TradeAction'
        quantity:
          type: integer
          minimum: 1
          description: BUY 시 필수, SELL 시 무시 (전량 매도)
        amount:
          type: number
          description: BUY 시 금액으로 입력 (quantity와 택일)

    TradeResponse:
      type: object
      properties:
        success:
          type: boolean
        trade:
          type: object
          properties:
            id:
              type: string
            trade_date:
              type: string
              format: date
            stock_code:
              type: string
            stock_name:
              type: string
            action:
              $ref: '#/components/schemas/TradeAction'
            quantity:
              type: integer
            price:
              type: number
            total_amount:
              type: number
            realized_pnl:
              type: number
              nullable: true
        updated_portfolio:
          $ref: '#/components/schemas/PortfolioSummary'
        message:
          type: string

    TurnResultResponse:
      type: object
      properties:
        previous_date:
          type: string
          format: date
        current_date:
          type: string
          format: date
        portfolio:
          $ref: '#/components/schemas/PortfolioSummary'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionResponse'
        daily_return:
          type: number
        daily_return_pct:
          type: number
        is_game_over:
          type: boolean
        turn_number:
          type: integer
        total_turns:
          type: integer

    BacktestReportResponse:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        current_date:
          type: string
          format: date
        initial_capital:
          type: number
        final_value:
          type: number
        total_return_pct:
          type: number
        max_drawdown_pct:
          type: number
        total_trades:
          type: integer
        winning_trades:
          type: integer
        win_rate_pct:
          type: number
        profit_factor:
          type: number
          nullable: true
        daily_values:
          type: array
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: number
        stock_contributions:
          type: array
          items:
            type: object
            properties:
              stock_code:
                type: string
              stock_name:
                type: string
              total_pnl:
                type: number
              trade_count:
                type: integer

    ExportResponse:
      type: object
      description: 기존 백테스트 시스템과 호환되는 JSON 형식
      properties:
        start_date:
          type: string
        end_date:
          type: string
        initial_capital:
          type: number
        final_value:
          type: number
        total_return_pct:
          type: number
        max_drawdown_pct:
          type: number
        total_trades:
          type: integer
        winning_trades:
          type: integer
        win_rate_pct:
          type: number
        trades:
          type: array
          items:
            type: object
        daily_values:
          type: array
          items:
            type: array
